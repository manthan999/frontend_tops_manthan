<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Components</title>

  
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>


<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="#">🎵 MusicApp</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link active" href="#">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">Playlists</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">Profile</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-5">

    <!-- 2. Flipkart Product Card -->
    <h3 class="mb-3">Product Preview</h3>

    <div class="card" style="width: 18rem;">
        <img src="images.jfif"card-img-top" alt="Product">
        <div class="card-body">
            <h5 class="card-title">Wireless Headphones</h5>
            <p class="card-text text-success fw-bold">$49.99</p>
            <a href="#" class="btn btn-primary">Buy Now</a>
        </div>
    </div>

   
    <h3 class="mt-5 mb-3">Featured Movies</h3>

    <div id="movieCarousel" class="carousel slide" data-bs-ride="carousel">

        <div class="carousel-inner">

            <div class="carousel-item active">
                <img src="et00403805-cxrwswcesf-portrait.webp"d-block w-100" alt="">
                <div class="carousel-caption d-none d-md-block">
                    <h5>Movie One</h5>
                </div>
            </div>

            <div class="carousel-item">
                <img src="et00478890-gseacbrsej-portrait.webp"d-block w-100" alt="">
                <div class="carousel-caption d-none d-md-block">
                    <h5>Movie Two</h5>
                </div>
            </div>

            <div class="carousel-item">
                <img src="https://via.placeholder.com/900x400?text=Movie+3" class="d-block w-100" alt="">
                <div class="carousel-caption d-none d-md-block">
                    <h5>Movie Three</h5>
                </div>
            </div>

        </div>

        <button class="carousel-control-prev" type="button" data-bs-target="#movieCarousel" data-bs-slide="prev">
            <span class="carousel-control-prev-icon"></span>
        </button>

        <button class="carousel-control-next" type="button" data-bs-target="#movieCarousel" data-bs-slide="next">
            <span class="carousel-control-next-icon"></span>
        </button>

    </div>

   
    <h3 class="mt-5">Restaurant Review</h3>

    <form class="mt-3">

        <div class="mb-3">
            <label class="form-label">Name</label>
            <input type="text" class="form-control" placeholder="Enter your name">
        </div>

        <div class="mb-3">
            <label class="form-label">Rating</label>
            <select class="form-select">
                <option>1 Star</option>
                <option>2 Stars</option>
                <option>3 Stars</option>
                <option>4 Stars</option>
                <option>5 Stars</option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Review</label>
            <textarea class="form-control" rows="4" placeholder="Write your review"></textarea>
        </div>

        <button class="btn btn-danger">Submit Review</button>

    </form>

   
    <h3 class="mt-5 mb-3">Food Filters</h3>

    <div class="btn-group">
        <button class="btn btn-primary active">All</button>
        <button class="btn btn-outline-primary">Veg</button>
        <button class="btn btn-outline-primary">Non-Veg</button>
        <button class="btn btn-outline-primary">Desserts</button>
    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
