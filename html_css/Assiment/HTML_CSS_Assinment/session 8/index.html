<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <!-- Meta Viewport -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Responsive Flipkart Product Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="product-card">
    <div class="product-image">
        <img src="images.jfif" alt="Product">
    </div>

    <div class="product-details">
        <h2>Wireless Bluetooth Headphones</h2>

        <p class="price">$49.99 <span>$69.99</span></p>

        <p class="description">
            High-quality wireless headphones with deep bass, noise cancellation,
            and up to 20 hours of battery life.
        </p>

        <button>Add to Cart</button>
    </div>
</div>

</body>
</html>
