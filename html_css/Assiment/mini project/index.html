<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Music & Gamer Bio Links</title>

<!-- Font Awesome Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI,Arial,sans-serif;
}

body{
    background:#121212;
    color:#fff;
    padding:30px;
}

/* ---------- Gamer Bio ---------- */

.bio-container{
    max-width:1100px;
    margin:auto;
}

.gamer-card{
    display:flex;
    gap:30px;
    align-items:center;
    background:#1e1e1e;
    padding:25px;
    border-radius:18px;
    margin-bottom:35px;
    box-shadow:0 10px 25px rgba(0,0,0,.35);
}

.avatar{
    width:150px;
    height:150px;
    border-radius:50%;
    border:5px solid #00d9ff;
    object-fit:cover;
}

.details h1{
    color:#00d9ff;
    margin-bottom:8px;
}

.details p{
    color:#bbb;
    margin-bottom:18px;
}

.game-links{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
}

.game-links a{
    text-decoration:none;
    color:white;
    padding:12px 18px;
    border-radius:8px;
    font-weight:bold;
    transition:.3s;
}

.twitch{background:#9146FF;}
.discord{background:#5865F2;}
.steam{background:#171A21;}

.game-links a:hover{
    transform:translateY(-3px);
}

/* ---------- Form ---------- */

.form-box{
    background:#1d1d1d;
    padding:25px;
    border-radius:15px;
    margin-bottom:30px;
}

.form-box h2{
    margin-bottom:20px;
    color:#00d9ff;
}

.input-group{
    position:relative;
    margin-bottom:18px;
}

.input-group i{
    position:absolute;
    top:50%;
    left:16px;
    transform:translateY(-50%);
    color:#777;
    font-size:20px;
}

.input-group input{
    width:100%;
    padding:14px 16px 14px 50px;
    border:none;
    outline:none;
    border-radius:8px;
    font-size:15px;
}

button{
    padding:13px 25px;
    background:#00d9ff;
    border:none;
    border-radius:8px;
    color:#111;
    font-size:16px;
    cursor:pointer;
    font-weight:bold;
}

button:hover{
    background:#00b8d8;
}

/* ---------- Preview Cards ---------- */

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
    gap:20px;
}

.card{
    padding:20px;
    border-radius:15px;
    color:white;
    box-shadow:0 8px 20px rgba(0,0,0,.3);
}

.card i{
    font-size:42px;
    margin-bottom:15px;
}

.card h3{
    margin-bottom:10px;
}

.card p{
    margin-bottom:18px;
    word-break:break-word;
}

.card a{
    display:inline-block;
    text-decoration:none;
    padding:10px 18px;
    border-radius:8px;
    color:white;
    font-weight:bold;
}

/* Individual Platform Styles */

.spotify{
    background:#1DB95420;
    border-left:6px solid #1DB954;
}
.spotify a{background:#1DB954;}

.youtube{
    background:#ff000020;
    border-left:6px solid #ff0000;
}
.youtube a{background:#ff0000;}

.apple{
    background:#aaaaaa20;
    border-left:6px solid #dddddd;
}
.apple a{
    background:#444;
}

/* ---------- Responsive ---------- */

@media(max-width:768px){

.gamer-card{
    flex-direction:column;
    text-align:center;
}

.game-links{
    justify-content:center;
}

.avatar{
    width:120px;
    height:120px;
}

}
</style>
</head>
<body>

<div class="bio-container">

    <!-- Gamer Bio Section -->

    <div class="gamer-card">
            
        <img src="WhatsApp Image 2026-07-28 at 22.00.48 (1).jpeg" class="avatar">

        <div class="details">
            <h1>ShadowHunter</h1>
            <p>FPS • RPG • Live Streaming</p>

            <div class="game-links">
                <a class="twitch" href="https://twitch.tv/" target="_blank">
                    <i class="fab fa-twitch"></i> Twitch
                </a>

                <a class="discord" href="https://discord.com/" target="_blank">
                    <i class="fab fa-discord"></i> Discord
                </a>

                <a class="steam" href="https://store.steampowered.com/" target="_blank">
                    <i class="fab fa-steam"></i> Steam
                </a>
            </div>
        </div>

    </div>

    <!-- Music Links Form -->

    <div class="form-box">

        <h2>Music Links Form</h2>

        <form id="musicLinksForm">

            <div class="input-group">
                <i class="fab fa-spotify"></i>
                <input type="url" id="spotify" placeholder="Spotify Profile URL">
            </div>

            <div class="input-group">
                <i class="fab fa-youtube"></i>
                <input type="url" id="youtube" placeholder="YouTube Music/Profile URL">
            </div>

            <div class="input-group">
                <i class="fab fa-apple"></i>
                <input type="url" id="apple" placeholder="Apple Music Profile URL">
            </div>

            <!-- Example social inputs with icons -->

            <div class="input-group">
                <i class="fab fa-instagram"></i>
                <input type="url" placeholder="Instagram URL (optional)">
            </div>

            <div class="input-group">
                <i class="fab fa-linkedin"></i>
                <input type="url" placeholder="LinkedIn URL (optional)">
            </div>

            <button type="submit">Generate Preview</button>

        </form>

    </div>

    <div class="cards" id="previewCards"></div>

</div>

<script>

const form=document.getElementById("musicLinksForm");
const preview=document.getElementById("previewCards");

function getUsername(url){

    try{

        const path=new URL(url).pathname
        .split("/")
        .filter(Boolean);

        return path[path.length-1] || "Unknown";

    }catch{
        return "Unknown";
    }
}

function createCard(platform,url){

    if(!url) return "";

    const username=getUsername(url);

    let cls="",icon="",title="";

    switch(platform){

        case "spotify":
            cls="spotify";
            icon="fab fa-spotify";
            title="Spotify";
        break;

        case "youtube":
            cls="youtube";
            icon="fab fa-youtube";
            title="YouTube Music";
        break;

        case "apple":
            cls="apple";
            icon="fab fa-apple";
            title="Apple Music";
        break;
    }

    return `
        <div class="card ${cls}">
            <i class="${icon}"></i>
            <h3>${title}</h3>
            <p><strong>@${username}</strong></p>
            <a href="${url}" target="_blank">Visit</a>
        </div>
    `;
}

form.addEventListener("submit",function(e){

    e.preventDefault();

    preview.innerHTML="";

    const spotify=document.getElementById("spotify").value.trim();
    const youtube=document.getElementById("youtube").value.trim();
    const apple=document.getElementById("apple").value.trim();

    preview.innerHTML += createCard("spotify",spotify);
    preview.innerHTML += createCard("youtube",youtube);
    preview.innerHTML += createCard("apple",apple);

});
</script>

</body>
</html>
