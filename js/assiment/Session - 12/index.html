<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Session 12 - Fetch API</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 30px;
        font-family: Arial, sans-serif;
        background: #f4f4f4;
      }

      .container {
        max-width: 1000px;
        margin: auto;
        background: white;
        padding: 30px;
        border-radius: 12px;
      }

      h1 {
        text-align: center;
        margin-bottom: 10px;
      }

      p {
        text-align: center;
        color: #555;
      }

      button {
        display: block;
        margin: 20px auto;
        padding: 12px 25px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        background: #222;
        color: white;
        font-size: 16px;
      }

      button:hover {
        background: #444;
      }

      .info {
        margin-top: 30px;
        padding: 20px;
        background: #eee;
        border-radius: 8px;
      }

      code {
        background: #ddd;
        padding: 2px 5px;
        border-radius: 4px;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h1>Session 12 - Fetch API</h1>

      <p>Open the browser console and Network tab to see the results.</p>

      <button onclick="runAllTasks()">Run Fetch Tasks</button>

      <div class="info">
        <h3>Instructions</h3>

        <ol>
          <li>Open Developer Tools using F12.</li>
          <li>Open the Console tab.</li>
          <li>Click "Run Fetch Tasks".</li>
          <li>Open Network tab to inspect API requests.</li>
        </ol>
      </div>
    </div>

    <script>

      function task1() {
        fetch("https://jsonplaceholder.typicode.com/posts")
          .then(function (response) {
            return response.json();
          })

          .then(function (posts) {
            console.log("TASK 1");

            posts.slice(0, 5).forEach(function (post) {
              console.log(post.title);
            });
          })

          .catch(function (error) {
            console.error("Task 1 Error:", error);
          });
      }



      function task2() {
        fetch("https://jsonplaceholder.typicode.com/posts")
          .then(function (response) {
            return response.json();
          })

          .then(function (posts) {
            console.log("TASK 2");

            posts.slice(0, 5).forEach(function (post) {
              console.log(post.title);
            });
          })

          .catch(function (error) {
            console.error("Task 2 Error:", error);
          });
      }

      function task3() {
        fetch("https://jsonplaceholder.typicode.com/posts")
          .then(function (response) {
            return response.json();
          })

          .then(function (posts) {
            console.log("TASK 3");

            posts.slice(0, 5).forEach(function (post) {
              console.log(post.title);
            });
          })

          .catch(function (error) {
            console.error("Task 3 Error:", error);
          });
      }

      function fetchToMovies() {
        fetch("https://jsonplaceholder.typicode.com/albums")
          .then(function (response) {
            return response.json();
          })

          .then(function (albums) {
            console.log("TASK 4 - Trending Movies");

            albums.slice(0, 3).forEach(function (album) {
              console.log("Movie:", album.title);
            });
          })

          .catch(function (error) {
            console.error("Task 4 Error:", error);
          });
      }

      function task5() {
        fetch("https://jsonplaceholder.typicode.com/albums")
          .then(function (response) {
            return response.json();
          })

          .then(function (albums) {
            console.log("TASK 5 - Trending Movies");

            albums.slice(0, 3).forEach(function (album) {
              console.log("Movie:", album.title);
            });
          })

          .catch(function (error) {
            console.error("Task 5 Error:", error);
          });
      }


      function task6() {
        const postData = {
          title: "My New Post",

          body: "This is my post body.",

          userId: 1,
        };

        fetch("https://jsonplaceholder.typicode.com/posts", {
          method: "POST",

          headers: {
            "Content-Type": "application/json",
          },

          body: JSON.stringify(postData),
        })
          .then(function (response) {
            return response.json();
          })

          .then(function (data) {
            console.log("TASK 6 - POST Response");

            console.log(data);
          })

          .catch(function (error) {
            console.error("Task 6 Error:", error);
          });
      }

      function addNewPlaylist() {
        const playlist = {
          name: "My Awesome Playlist",

          description: "A collection of my favourite songs.",
        };

        fetch("https://jsonplaceholder.typicode.com/posts", {
          method: "POST",

          headers: {
            "Content-Type": "application/json",
          },

          body: JSON.stringify(playlist),
        })
          .then(function (response) {
            return response.json();
          })

          .then(function (data) {
            console.log("TASK 7 - New Playlist");

            console.log(data);
          })

          .catch(function (error) {
            console.error("Task 7 Error:", error);
          });
      }

      function task8() {
        const playlist = {
          name: "Coding Playlist",

          description: "Songs I listen to while coding.",
        };

        fetch("https://jsonplaceholder.typicode.com/posts", {
          method: "POST",

          headers: {

            console.log(data);
          })

          .catch(function (error) {
            console.error("Task 8 Error:", error);
          });
      }


      function task9() {
        fetch("https://jsonplaceholder.typicode.com/users")
          .then(function (response) {
            return response.json();
          })

          .then(function (users) {
            const emails = users.map(function (user) {
              return user.email;
            });

            alert(emails.join(", "));
          })

          .catch(function (error) {
            console.error("Task 9 Error:", error);
          });
      }

      function task10() {
        fetch("https://jsonplaceholder.typicode.com/users/2")
          .then(function (response) {
            return response.json();
          })

          .then(function (user) {
            console.log("TASK 10");

            console.log("User Name:", user.name);

            return fetch(
              "https://jsonplaceholder.typicode.com/posts?userId=" + user.id,
            );
          })

          .then(function (response) {
            return response.json();
          })

          .then(function (posts) {
            console.log("User Posts:");

            posts.forEach(function (post) {
              console.log(post.title);
            });
          })

          .catch(function (error) {
            console.error("Task 10 Error:", error);
          });
      }


      function task11() {
        fetch("https://jsonplaceholder.typicode.com/users/2")
          .then(function (response) {
            return response.json();
          })

          .then(function (user) {
            console.log("TASK 11");

            console.log("User Name:", user.name);

            return fetch(
              "https://jsonplaceholder.typicode.com/posts?userId=" + user.id,
            );
          })

          .then(function (response) {
            return response.json();
          })

          .then(function (posts) {
            console.log("Post Titles:");

            posts.forEach(function (post) {
              console.log(post.title);
            });
          })

          .catch(function (error) {
            console.error("Task 11 Error:", error);
          });
      }


      function task12() {
        fetch("https://jsonplaceholder.typicode.com/users")
          .then(function (response) {
            console.log("TASK 12 - Response Status:", response.status);

            return response.json();
          })

          .then(function (users) {
            console.log("Users received:", users);
          })

          .catch(function (error) {
            console.error("Task 12 Error:", error);
          });
      }

      function task13() {
        fetch("https://jsonplaceholder.typicode.com/users")
          .then(function (response) {
            console.log("TASK 13 - Response Status:", response.status);

            return response.json();
          })

          .then(function (users) {
            console.log("Users:", users);
          })

          .catch(function (error) {
            console.error("Task 13 Error:", error);
          });
      }

      function task14() {
        fetch("https://jsonplaceholder.typicode.com/users")
          .then(function (response) {
            console.log("TASK 14 - Status:", response.status);

            return response.json();
          })

          .then(function (users) {
            console.log("Received users:", users);
          })

          .catch(function (error) {
            console.error("Task 14 Error:", error);
          });
      }

      function task15() {
        fetch("https://jsonplaceholder.typicode.com/albums")
          .then(function (response) {
            return response.json();
          })

          .then(function (albums) {
            const filteredAlbums = albums.filter(function (album) {
              return album.userId === 2;
            });

            console.log("TASK 15 - Albums of User 2");

            filteredAlbums.forEach(function (album) {
              console.log(album.title);
            });
          })

          .catch(function (error) {
            console.error("Task 15 Error:", error);
          });
      }


      function runAllTasks() {
        task1();

        task2();

        task3();

        fetchToMovies();

        task5();

        task6();

        addNewPlaylist();

        task8();

        task9();

        task10();

        task11();

        task12();

        task13();

        task14();

        task15();
      }
    </script>
  </body>
</html>
