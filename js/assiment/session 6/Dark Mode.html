<!DOCTYPE html>
<html>
<head>
    <title>Dark Mode</title>
</head>
<body>

    <button id="darkModeBtn" onclick="darkMode()">Dark Mode</button>

    <script>
        function darkMode() {
            document.body.style.backgroundColor = "black";
            document.getElementById("darkModeBtn").innerText = "Light Mode";
        }
    </script>

</body>
</html>
